global:
  environment: staging

configMap:
  name: better-backend-app-config

beat:
  appName: better-backend-app-beat
  image:
    repository: asia-south1-docker.pkg.dev/bo-stage/bo-main/django-backend
    tag: latest
  replicas: 1
  resources:
    requests:
      cpu: 2
      memory: 4Gi 
    limits:
      cpu: 3
      memory: 6Gi
