name: Deploy Backend Application and Configuration

on:
  workflow_dispatch:

env:
  PROJECT_ID: bo-stage
  REGION: asia-south1
  ARTIFACT_REPO: bo-backend-django
  IMAGE_NAME: backend-application
  
jobs:
  setup:
    uses: ./.github/workflows/install.yml
    secrets: inherit
    
  deploy:
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v0.2.0
        with:
          project_id: bo-stage
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Trigger Docker Build and Push Workflow
        uses: peter-evans/repository-dispatch@v2
        with:
          repository: <owner>/<repo> # Replace <owner>/<repo> with the target repository name
          event-type: trigger-docker-build
          token: ${{ secrets.TRIGGER_REPO_PAT }}
          client-payload: >
            {
              "project_id": "${{ env.PROJECT_ID }}",
              "region": "${{ env.REGION }}",
              "artifact_repo": "${{ env.ARTIFACT_REPO }}",
              "image_name": "${{ env.IMAGE_NAME }}",
              "github_sha": "${{ github.sha }}"
            }

      - name: Wait for Docker Build and Push Workflow Completion
        uses: actions/github-script@v6
        with:
          script: |
            const token = process.env.TRIGGER_REPO_PAT;
            const { Octokit } = require("@octokit/rest");
            const octokit = new Octokit({ auth: token });

            const owner = "<owner>";   
            const repo = "<repo>";  
            const runs = await octokit.rest.actions.listWorkflowRunsForRepo({
              owner,
              repo,
              event: "repository_dispatch",
              per_page: 1,
            });

            const run = runs.data.workflow_runs[0];
            if (!run) throw new Error("No workflow run found for repository_dispatch event.");
            let status = run.status;
            while (status !== "completed") {
              await new Promise((resolve) => setTimeout(resolve, 30000)); 
              const updatedRun = await octokit.rest.actions.getWorkflowRun({
                owner,
                repo,
                run_id: run.id,
              });
              status = updatedRun.data.status;
            }

            if (run.conclusion !== "success") {
              throw new Error("Docker Build and Push Workflow failed!");
            }
        env:
          TRIGGER_REPO_PAT: ${{ secrets.TRIGGER_REPO_PAT }}
          
      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin
          
      - name: Configure kubectl
        run: |
          gcloud container clusters get-credentials autopilot-bo-cluster --region asia-south1 --project bo-stage
          
      - name: Deploy Helm Chart
        id: deploy
        run: |
          helm upgrade --install backend-application ./application --set image.tag=${{ github.sha }} || echo "::set-output name=deploy_failed::true"

      - name: Rollback if deployment failed
        if: steps.deploy.outputs.deploy_failed == 'true'
        run: |
          LAST_REVISION=$(helm history backend-application -o json | jq -r '.[] | select(.status == "deployed") | .revision' | sort -rn | head -n 1)
          if [ -n "$LAST_REVISION" ]; then
            echo "Rolling back to revision $LAST_REVISION"
            helm rollback backend-application $LAST_REVISION
          else
            echo "No previous successful revision found. Unable to rollback."
            exit 1
          fi
