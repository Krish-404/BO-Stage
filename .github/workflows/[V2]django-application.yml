name: Backend Application and Configuration

on:
  workflow_dispatch:
    inputs:
      project_id:
        description: 'Select the Google Cloud Project'
        required: true
        type: string
        default: bo-stage
        options:
          - bo-stage
          - bo-prod
          - bo-dev
      region:
        description: 'Select the Region'
        required: true
        type: string
        default: asia-south1
        options:
          - asia-south1
          - us-central1
          - europe-west1
      artifact_repo:
        description: 'Select the Artifact Repository'
        required: true
        type: string
        default: bo-backend-django
        options:
          - bo-backend-django
          - bo-backend-node
          - bo-backend-go

env:
  IMAGE_NAME: backend-application

# jobs:
#   setup:
#     uses: ./.github/workflows/install.yml
#     secrets: inherit

  deploy:
    needs: setup
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v0.2.0
        with:
          project_id: ${{ inputs.project_id }}
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          export_default_credentials: true

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ inputs.region }}-docker.pkg.dev

      - name: Trigger Client Workflow
        id: trigger-client-workflow
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.TRIGGER_REPO_PAT }}
          script: |
            const response = await github.rest.actions.createWorkflowDispatch({
              owner: 'code-owner-betteropinions',
              repo: 'BetterOpinions-BE-Django',
              workflow_id: 'build_push_gcp.yml', 
              ref: 'fearture/docker-gcp-support', 
              inputs: {
                project_id: '${{ inputs.project_id }}',
                region: '${{ inputs.region }}',
                artifact_repo: '${{ inputs.artifact_repo }}'
                run_id: '${{ github. run_id }}'
              }
            });
            core.info('Triggered client workflow: build_push_gcp.yml on branch main.');

      - name: Wait for Client Workflow Success
        id: wait-client-workflow
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.TRIGGER_REPO_PAT }}
          script: |
            const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));
            const maxAttempts = 30; 
            const interval = 60 * 1000; 
            let attempts = 0;
            let success = false;

            while (attempts < maxAttempts) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: 'code-owner-betteropinions',
                repo: 'BetterOpinions-BE-Django',
                workflow_id: 'build_push_gcp.yml',
                branch: 'fearture/docker-gcp-support',
                per_page: 1
              });

              const latestRun = runs.data.workflow_runs[0];
              if (latestRun && latestRun.status === 'completed' && latestRun.conclusion === 'success') {
                success = true;
                core.info(`Client workflow succeeded. Run ID: ${latestRun.id}`);
                break;
              } else if (latestRun && latestRun.status === 'completed') {
                core.setFailed('Client workflow completed but failed.');
                break;
              }

              core.info(`Waiting for client workflow to complete... Attempt ${attempts + 1}`);
              await wait(interval);
              attempts++;
            }

            if (!success) {
              core.setFailed('Client workflow did not complete successfully or timed out.');
            }

